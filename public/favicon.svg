<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="50" cy="50" r="46" fill="#064e3b" stroke="#10b981" stroke-width="3" filter="url(#shadow)" />

  <!-- Satellite Orbit Arc -->
  <path d="M16 48 A36 24 35 0 1 84 52" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2.5" />
  <circle cx="78" cy="38" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Radar Wave Rays from Satellite -->
  <path d="M78 38 L54 62" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
  <path d="M78 38 L66 74" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />

  <!-- Agricultural Crop Plant / Paddy Ear -->
  <!-- Stem -->
  <path d="M50 82 Q49 55 50 32" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <!-- Left Leaf -->
  <path d="M50 64 C35 58 30 42 48 48 C49 54 50 60 50 64 Z" fill="url(#cropGrad)" stroke="#86efac" stroke-width="1" />
  <!-- Right Leaf -->
  <path d="M50 54 C65 48 70 34 52 38 C51 44 50 50 50 54 Z" fill="url(#cropGrad)" stroke="#86efac" stroke-width="1" />
  <!-- Golden Grain Grains at Top -->
  <ellipse cx="50" cy="27" rx="3.5" ry="6" fill="url(#goldGrad)" />
  <ellipse cx="44" cy="33" rx="3" ry="5" transform="rotate(-25 44 33)" fill="url(#goldGrad)" />
  <ellipse cx="56" cy="33" rx="3" ry="5" transform="rotate(25 56 33)" fill="url(#goldGrad)" />

  <!-- UAV Drone Icon Indicator at Top Left -->
  <circle cx="28" cy="28" r="3" fill="#f59e0b" />
  <line x1="23" y1="28" x2="33" y2="28" stroke="#f59e0b" stroke-width="1.2" />
  <line x1="28" y1="23" x2="28" y2="33" stroke="#f59e0b" stroke-width="1.2" />
</svg>
